[package]
name = "grace17-checkers"
version = "0.1.0"
edition = "2021"
description = "Independent Rust checkers for Grace17 G17M proof tapes and G17C compiled modules"
license = "Apache-2.0"
publish = false

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
sha2 = "0.10"

[[bin]]
name = "g17check"
path = "src/bin/g17check.rs"

[[bin]]
name = "g17c_check"
path = "src/bin/g17c_check.rs"

[profile.release]
opt-level = 3
debug = false
