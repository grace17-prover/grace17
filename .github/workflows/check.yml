name: check

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  library:
    name: Cumulus library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Restore module artifacts
        uses: actions/cache@v4
        with:
          path: build/modules
          key: modules-${{ hashFiles('lib/**/*.g17', 'src/**/*.ts') }}
          restore-keys: modules-
      - name: Build library modules
        run: npm run build:modules
      - run: npm run check:headers
      - name: Replay every library theorem in one process
        run: node --disable-warning=ExperimentalWarning scripts/run-tests.ts cumulus.test --concurrency 1

  browser:
    # The other jobs run the current Node line. The browser build also has
    # to work on the oldest Node the package allows, so that the engines
    # field stays honest.
    name: Browser build on Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:headers
      - run: npm run build:browser

  rust:
    # The Rust checkers replay the whole library beside a Node process that
    # compiles it; together they need most of a runner's memory, so they
    # run alone rather than in a shard beside another heavy file.
    name: Rust checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Restore module artifacts
        uses: actions/cache/restore@v4
        with:
          path: build/modules
          key: modules-${{ hashFiles('lib/**/*.g17', 'src/**/*.ts') }}
          restore-keys: modules-
      - name: Build and replay with the Rust checkers
        run: node --disable-warning=ExperimentalWarning scripts/run-tests.ts rust-checker --concurrency 1 --heavy-heap 10240

  tests:
    name: Tests ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Restore module artifacts
        uses: actions/cache/restore@v4
        with:
          path: build/modules
          key: modules-${{ hashFiles('lib/**/*.g17', 'src/**/*.ts') }}
          restore-keys: modules-
      - run: npm run build:browser
      - name: Run test files one process each
        run: node --disable-warning=ExperimentalWarning scripts/run-tests.ts --shard ${{ matrix.shard }} --concurrency 2 --heavy-heap 10240 --exclude cumulus.test,rust-checker
