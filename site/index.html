<style>
:root {
  --navy: #12233f;
  --cream: #f2ecdd;
  --verdigris: #55b39e;
  --slate: #8ea3c4;
  --brace: #182b4a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--navy);
  color: var(--cream);
  font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  overflow-x: hidden;
}
::selection { background: var(--verdigris); color: var(--navy); }
.frame {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  user-select: none;
  z-index: 0;
}
.frame span {
  position: absolute;
  top: 50%;
  transform: translateY(-54%);
  font-size: min(130vh, 108vw);
  font-weight: 500;
  line-height: 1;
  color: var(--brace);
  opacity: 0.55;
}
.frame .l { left: -0.14em; }
.frame .r { right: -0.14em; }
main {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2.2rem;
  padding: 3rem 1.5rem;
  text-align: center;
}
.wordmark { width: min(76vw, 620px); height: auto; display: block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.tagline {
  color: var(--slate);
  font-size: clamp(0.95rem, 2.4vw, 1.15rem);
  font-weight: 400;
  line-height: 1.7;
  max-width: 34em;
}
.gh {
  display: inline-block;
  margin-top: 0.4rem;
  padding: 0.7rem 1.5rem;
  border: 1px solid var(--verdigris);
  color: var(--verdigris);
  text-decoration: none;
  font-size: 0.95rem;
  font-weight: 500;
  transition: background-color 120ms ease, color 120ms ease;
}
.gh:hover, .gh:focus-visible { background: var(--verdigris); color: var(--navy); outline: none; }
.set {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: baseline;
  gap: 0.2rem 0.6rem;
  max-width: 58em;
  font-size: clamp(0.9rem, 2.1vw, 1.08rem);
  font-weight: 500;
}
.set .brace { color: var(--verdigris); font-size: 1.55em; line-height: 1; transform: translateY(0.08em); margin: 0 0.35rem; }
.set .el { display: inline-flex; align-items: baseline; }
.set .comma { color: var(--verdigris); }
.set a {
  color: var(--cream);
  text-decoration: none;
  padding: 0.3rem 0.1rem;
  border-bottom: 1px solid transparent;
  transition: color 120ms ease, border-color 120ms ease;
}
.set a:hover, .set a:focus-visible { color: var(--verdigris); border-bottom-color: var(--verdigris); outline: none; }
/* On a narrow screen the set is written over several lines: the opening
   brace at the start, the elements wrapping in a column between the braces,
   the closing brace closing the last line. */
.set .els { display: contents; }
@media (max-width: 760px) {
  .set {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    column-gap: 0.35rem;
    width: fit-content;
    max-width: 100%;
    margin-inline: auto;
    align-items: baseline;
  }
  .set .brace.open { align-self: start; margin: 0; }
  .set .brace.close { align-self: end; margin: 0; }
  .set .els {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    gap: 0.2rem 0.6rem;
  }
}
}
</style>
