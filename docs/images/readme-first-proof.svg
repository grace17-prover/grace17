<svg xmlns="http://www.w3.org/2000/svg" width="376.77" height="304" viewBox="0 0 376.77 304" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" fill="#d8e2e7">
<rect width="376.77" height="304" rx="10" fill="#0c1b30" stroke="#27405f"/>
<text x="24" y="37" xml:space="preserve"><tspan fill="#57f4ff">module</tspan> FirstSteps</text>
<text x="24" y="61" xml:space="preserve"><tspan fill="#57f4ff">import</tspan> Grace.Cumulus.Set</text>
<text x="24" y="85" xml:space="preserve"></text>
<text x="24" y="109" xml:space="preserve"><tspan fill="#57f4ff">theorem</tspan> subset_transitive (A B C : <tspan fill="#00c8d7">Set</tspan>)</text>
<text x="24" y="133" xml:space="preserve">  <tspan fill="#57f4ff">requires</tspan> hab : A <tspan fill="#aab8c0">⊆</tspan> B</text>
<text x="24" y="157" xml:space="preserve">  <tspan fill="#57f4ff">requires</tspan> hbc : B <tspan fill="#aab8c0">⊆</tspan> C</text>
<text x="24" y="181" xml:space="preserve">  <tspan fill="#57f4ff">shows</tspan> A <tspan fill="#aab8c0">⊆</tspan> C</text>
<text x="24" y="205" xml:space="preserve"><tspan fill="#57f4ff">proof</tspan></text>
<text x="24" y="229" xml:space="preserve">  <tspan fill="#65aef2">intros</tspan> x hx</text>
<text x="24" y="253" xml:space="preserve">  <tspan fill="#65aef2">have</tspan> hb <tspan fill="#aab8c0">:=</tspan> hab <tspan fill="#65aef2">with</tspan> x, hx</text>
<text x="24" y="277" xml:space="preserve">  <tspan fill="#65aef2">exact</tspan> hbc <tspan fill="#65aef2">with</tspan> x, hb</text>
</svg>
