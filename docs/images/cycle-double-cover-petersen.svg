<text x="24" y="412" fill="#f2ecdd" font-size="12" opacity="0.8">the Petersen graph: six cycles, every edge in exactly two</text>
<text x="470" y="60" fill="#f2ecdd" font-size="30" font-family="Georgia, 'Times New Roman', serif">The cycle double cover <tspan fill="#8aa4c8" text-decoration="line-through" font-style="italic">conjecture</tspan> <tspan fill="#55b39e" font-weight="bold">theorem</tspan></text>
<text x="470" y="108" fill="#f2ecdd" font-size="24" font-family="Georgia, 'Times New Roman', serif">Every finite bridgeless multigraph has a list of cycles</text>
<text x="470" y="140" fill="#f2ecdd" font-size="24" font-family="Georgia, 'Times New Roman', serif">in which every edge lies exactly twice.</text>
<text x="470" y="182" fill="#f2ecdd" font-size="13" opacity="0.7" letter-spacing="2">PROVED IN GRACE17 FROM THE AXIOMS OF SET THEORY</text>
<text x="470" y="226" font-size="17" xml:space="preserve"><tspan fill="#65aef2">theorem</tspan><tspan fill="#f2ecdd"> cycleDoubleCover (V E leftEnd rightEnd : Set)</tspan></text>
<text x="470" y="253" font-size="17" xml:space="preserve"><tspan fill="#65aef2">  requires</tspan><tspan fill="#f2ecdd"> graph : Graph(V, E, leftEnd, rightEnd)</tspan></text>
<text x="470" y="280" font-size="17" xml:space="preserve"><tspan fill="#65aef2">  requires</tspan><tspan fill="#f2ecdd"> finiteVertices : Finite(V)</tspan></text>
<text x="470" y="307" font-size="17" xml:space="preserve"><tspan fill="#65aef2">  requires</tspan><tspan fill="#f2ecdd"> finiteEdges : Finite(E)</tspan></text>
<text x="470" y="334" font-size="17" xml:space="preserve"><tspan fill="#65aef2">  requires</tspan><tspan fill="#f2ecdd"> bridgeless : Bridgeless(V, E, leftEnd, rightEnd)</tspan></text>
<text x="470" y="361" font-size="17" xml:space="preserve"><tspan fill="#65aef2">  shows</tspan><tspan fill="#f2ecdd"> ∃ H, ∃ I, CycleDoubleCover(V, E, leftEnd, rightEnd, H, I)</tspan></text>
</svg>
