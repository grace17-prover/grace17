<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 420 450" role="img" aria-labelledby="t">
<title id="t">The Tarski–Grothendieck axiom: every set lies in some Grothendieck universe, so the universes V_κ₀ ⊂ V_κ₁ ⊂ V_κ₂ ⊂ … climb without end through V, each inaccessible κᵢ a member of the next universe</title>
