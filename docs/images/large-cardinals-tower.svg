<text x="334" y="154">V<tspan baseline-shift="sub" font-size="9">κ₃</tspan></text>
<text x="311" y="204">V<tspan baseline-shift="sub" font-size="9">κ₂</tspan></text>
<text x="289" y="254">V<tspan baseline-shift="sub" font-size="9">κ₁</tspan></text>
<text x="269" y="294">V<tspan baseline-shift="sub" font-size="9">κ₀</tspan></text>
</g>
<g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#f2ecdd">
