</g>
<circle cx="210" cy="400" r="4" fill="#55b39e"/>
<text x="210" y="417" text-anchor="middle" fill="#f2ecdd" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="12">V₀ = ∅</text>
<text x="30" y="372" fill="#b79cff" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10">every set x lies</text>
<text x="30" y="385" fill="#b79cff" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10">in some universe</text>
