<text x="24" y="109" xml:space="preserve"><tspan fill="#57f4ff">theorem</tspan> difference_of_squares (x y : Integer)</text>
<text x="24" y="133" xml:space="preserve">  <tspan fill="#57f4ff">shows</tspan> (x <tspan fill="#aab8c0">+</tspan> y) <tspan fill="#aab8c0">*</tspan> (x - y) <tspan fill="#aab8c0">=</tspan> x <tspan fill="#aab8c0">*</tspan> x - y <tspan fill="#aab8c0">*</tspan> y</text>
<text x="24" y="157" xml:space="preserve"><tspan fill="#57f4ff">proof</tspan></text>
