<circle cx="268" cy="290" r="4.5" fill="#55b39e"/><text x="168" y="314">⋃ᵢ f(i)</text>
<circle cx="190" cy="186" r="4" fill="#f2ecdd"/><text x="198" y="190">ω</text>
</g>
