<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="t">
<title id="t">How the axiom audit tracks a large cardinal hypothesis: reliance flows up the dependency graph from a lemma that assumes it, while a theorem about universes relies on nothing</title>
<defs>
<marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b79cff"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#55b39e"/></marker>
<marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7d8d96"/></marker>
</defs>
<rect x="170" y="18" width="260" height="62" rx="9" fill="#b79cff" fill-opacity="0.12" stroke="#b79cff" stroke-width="1.8"/>
<text x="300" y="44" text-anchor="middle" fill="#f2ecdd" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13">your theorem</text>
<text x="300" y="64" text-anchor="middle" fill="#b79cff" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="12">relies on a large cardinal hypothesis</text>
<rect x="8" y="186" width="188" height="78" rx="9" fill="#b79cff" fill-opacity="0.08" stroke="#b79cff" stroke-width="1.5"/>
<text x="102" y="210" text-anchor="middle" fill="#f2ecdd" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11">universe_containing</text>
<text x="102" y="230" text-anchor="middle" fill="#b79cff" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5">premise: TarskiGrothendieck()</text>
<text x="102" y="250" text-anchor="middle" fill="#7d8d96" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11">relies on it</text>
<rect x="206" y="186" width="188" height="78" rx="9" fill="#55b39e" fill-opacity="0.08" stroke="#55b39e" stroke-width="1.5"/>
<text x="300" y="210" text-anchor="middle" fill="#f2ecdd" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11">eq_V (Williamson)</text>
<text x="300" y="230" text-anchor="middle" fill="#55b39e" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5">about universes: each is a V(κ)</text>
<text x="300" y="250" text-anchor="middle" fill="#7d8d96" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11">relies on nothing</text>
<rect x="404" y="186" width="188" height="78" rx="9" fill="none" stroke="#7d8d96" stroke-width="1.3"/>
<text x="498" y="210" text-anchor="middle" fill="#f2ecdd" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11">harmonicSeries.unbounded</text>
<text x="498" y="230" text-anchor="middle" fill="#7d8d96" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.5">no hypothesis</text>
<text x="498" y="250" text-anchor="middle" fill="#7d8d96" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11">ZF alone</text>
<path d="M102 184 Q126 120 206 82" fill="none" stroke="#b79cff" stroke-width="2.6" marker-end="url(#v)"/>
<path d="M300 184 L300 84" fill="none" stroke="#55b39e" stroke-width="1.4" marker-end="url(#g)"/>
<path d="M498 184 Q472 120 394 82" fill="none" stroke="#7d8d96" stroke-width="1.2" marker-end="url(#n)"/>
</svg>
