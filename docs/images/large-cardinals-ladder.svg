<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" role="img" aria-labelledby="t">
<title id="t">The large cardinal hierarchy by consistency strength, from ZFC through inaccessible, Mahlo, weakly compact, measurable, Woodin, supercompact, huge, and rank-into-rank cardinals, up to Kunen's inconsistency of Reinhardt cardinals with Choice</title>
<defs>
<marker id="up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 10 L5 0 L10 10 z" fill="#65aef2"/></marker>
</defs>
<path d="M60 470 L60 70" stroke="#65aef2" stroke-width="2.2" marker-end="url(#up)"/>
<text x="30" y="270" fill="#7d8d96" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13" transform="rotate(-90 30 270)" text-anchor="middle">consistency strength</text>
<path d="M44 46 L604 46" stroke="#ff6565" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="80" y="34" fill="#ff6565" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="13.5">Reinhardt, j : V → V: inconsistent with Choice (Kunen, 1971)</text>
<rect x="68" y="404" width="540" height="36" rx="7" fill="#b79cff" fill-opacity="0.10" stroke="#b79cff" stroke-width="1.4"/>
<g font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#f2ecdd">
<circle cx="60" cy="460" r="5" fill="#65aef2"/><text x="80" y="464">ZFC</text>
<circle cx="60" cy="422" r="5" fill="#b79cff"/><text x="80" y="426" fill="#b79cff">inaccessible</text>
<circle cx="60" cy="380" r="4" fill="#55b39e"/><text x="80" y="384">Mahlo</text>
<circle cx="60" cy="338" r="4" fill="#55b39e"/><text x="80" y="342">weakly compact</text>
<circle cx="60" cy="296" r="4" fill="#55b39e"/><text x="80" y="300">measurable</text>
<circle cx="60" cy="254" r="4" fill="#55b39e"/><text x="80" y="258">Woodin</text>
<circle cx="60" cy="212" r="4" fill="#55b39e"/><text x="80" y="216">supercompact</text>
<circle cx="60" cy="170" r="4" fill="#55b39e"/><text x="80" y="174">huge</text>
<circle cx="60" cy="128" r="4" fill="#55b39e"/><text x="80" y="132">rank-into-rank</text>
</g>
<g font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="15" fill="#aab8c0">
<text x="252" y="464">the axioms every certificate is checked from</text>
<text x="252" y="426" fill="#b79cff">V<tspan baseline-shift="sub" font-size="11">κ</tspan> is a model of ZFC; in Grace17 today</text>
<text x="252" y="384">the inaccessibles below κ are stationary</text>
<text x="252" y="342">κ → (κ)², a Ramsey property</text>
<text x="252" y="300">a κ-complete ultrafilter; j : V → M</text>
<text x="252" y="258">infinitely many give projective determinacy</text>
<text x="252" y="216">j : V → M, M closed under λ-sequences</text>
<text x="252" y="174">M closed under j(κ)-sequences</text>
<text x="252" y="132">j : V<tspan baseline-shift="sub" font-size="11">λ</tspan> → V<tspan baseline-shift="sub" font-size="11">λ</tspan></text>
</g>
<g fill="#55b39e"><circle cx="60" cy="98" r="1.8"/><circle cx="60" cy="88" r="1.8"/><circle cx="60" cy="78" r="1.8"/></g>
</svg>
